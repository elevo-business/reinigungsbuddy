server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hinter dem Coolify-Proxy (Traefik): relative Redirects, damit /leistungen → /leistungen/ nicht auf http:// oder Port 80 zeigt
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gehashte Build-Dateien und Schriften: 1 Jahr cachen
    location ~* ^/(_astro|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|pdf|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Seiten: /pfad/ → /pfad/index.html; /pfad (ohne Slash) wird von nginx per 301 auf /pfad/ umgeleitet
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
